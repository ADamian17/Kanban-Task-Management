query GetTask($id: ID!, $boardUri: String!) {
  getOneBoard(uri: $boardUri) {
    columns {
      nodes {
        id
        name
      }
    }
  }
  getOneTask(id: $id) {
    id
    title
    description
    status
    subtasks {
      count
      completedSubtasks
      nodes {
        id
        completed
        title
      }
    }
  }
}
